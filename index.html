<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; background-color: black; overflow: hidden; }
        img { width: 100vw; height: 100vh; object-fit: cover; }
    </style>
</head>
<body>
    <img src="tom_resmi.jpg" id="horrorTom">

    <audio id="glitchSound" loop autoplay>
        <source src="ses_dosyasi.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Bazı telefonlar otomatik sesi engeller, ekrana dokunulunca çalmasını garanti ederiz
        document.body.onclick = function() {
            document.getElementById('glitchSound').play();
        };
    </script>
</body>
</html>
